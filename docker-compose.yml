version: '3.1'

networks:
  dev_backend_network:

services:

  ws-go:
    container_name: dev.ws-go
    image: dev.ws-go:0.1
    build:
      context: ./ws-go
      args:
        - VERSION=1.23
    volumes:
      - ./ws-go/workspace:/root/workspace
      - ~/.gitconfig:/root/.gitconfig
      - ~/.ssh:/root/.ssh
    init: true
    privileged: true
    cap_add:
      - ALL
    working_dir: /root/workspace
    networks:
      - dev_backend_network
    ports:
      - 40022:22
    entrypoint: 'service ssh start -D'

  rabbitmq:
    container_name: dev.rabbitmq
    image: dev.rabbitmq:0.1
    build:
      context: ./rabbitmq
      args:
        - VERSION=3.12.6
    hostname: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_VHOST: vhost_admin
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_PLUGINS_DIR: '/plugins:/myplugins'
    expose:
      - 5552                                                  # stream protocol
      - 5672                                                  # amqp
      - 25672                                                 # clustering
      - 15692                                                 # prometheus
    ports:
      - 15672:15672                                           # rabbitmq management
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/myplugins:/myplugins
    networks:
      - dev_backend_network
  
  zookeeper:
    container_name: dev.zookeeper
    image: dev.zookeeper:0.1
    build:
      context: ./zookeeper
      args:
        - VERSION=7.6.1
    restart: always
    expose:
      - 2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./zookeeper/data:/var/lib/zookeeper/data
      - ./zookeeper/config:/etc/zookeeper/conf
    networks:
      - dev_backend_network

  kafka-old:
    container_name: dev.kafka-old
    image: dev.kafka-old:0.1
    build:
      context: ./kafka-old
      args:
        - VERSION=7.6.1
    restart: always
    depends_on:
      - zookeeper
    expose:
      - 9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-old:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ./kafka-old/data:/var/lib/kafka-old/data
      - ./kafka-old/config:/etc/kafka-old
    networks:
      - dev_backend_network

  kafka:
    container_name: dev.kafka
    image: dev.kafka:0.1
    build:
      context: ./kafka
      args:
        - VERSION=3.8.0
    restart: always
    expose:
      - 9092
      - 19092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19092
      KAFKA_CLUSTER_ID: dev.kafka
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/log/kafka
    volumes:
      - ./kafka/data/log:/var/log
    networks:
      - dev_backend_network

  kafka-node1:
    container_name: dev.kafka-node1
    image: dev.kafka:0.1
    build:
      context: ./kafka
      args:
        - VERSION=3.8.0
    restart: always
    expose:
      - 9092
      - 19092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-node1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-node1:19092,2@kafka-node2:19092
      KAFKA_CLUSTER_ID: dev.kafka-cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2 
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/log/kafka-node1
    volumes:
      - ./kafka/data/log:/var/log
    networks:
      - dev_backend_network

  kafka-node2:
    container_name: dev.kafka-node2
    image: dev.kafka:0.1
    build:
      context: ./kafka
      args:
        - VERSION=3.8.0
    restart: always
    expose:
      - 9092
      - 19092
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-node2:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-node1:19092,2@kafka-node2:19092
      KAFKA_CLUSTER_ID: dev.kafka-cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2 
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/log/kafka-node2
    volumes:
      - ./kafka/data/log:/var/log
    networks:
      - dev_backend_network

  kafka-ui:
    container_name: dev.kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: always
    ports:
      - "16080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-old
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-old:9092
      KAFKA_CLUSTERS_1_NAME: kafka
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_2_NAME: kafka-node1
      KAFKA_CLUSTERS_2_BOOTSTRAPSERVERS: kafka-node1:9092
      KAFKA_CLUSTERS_3_NAME: kafka-node2
      KAFKA_CLUSTERS_3_BOOTSTRAPSERVERS: kafka-node2:9092
    networks:
      - dev_backend_network

  mysql:
    container_name: dev.mysql
    image: dev.mysql:0.1
    build:
      context: ./mysql
      args:
        - VERSION=8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: defaultdb
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    expose:
      - 3306
    volumes:
      - ./mysql/data:/var/lib/mysql
    networks:
      - dev_backend_network

  postgres:
    container_name: dev.postgres
    image: dev.postgres:0.1
    build:
      context: ./postgres
      args:
        - VERSION=15
    restart: always
    environment:
      POSTGRES_DB: defaultdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    expose:
      - 5432
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - dev_backend_network

  adminer:
    container_name: dev.adminer
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - dev_backend_network

  redis:
    container_name: dev.redis
    image: dev.redis:0.1
    build:
      context: ./redis
      args:
        - VERSION=7
    restart: always
    expose:
      - 6379
    volumes:
      - ./redis/data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "mypassword"] # 開啟 AOF 持久化
    networks:
      - dev_backend_network

  redisinsight:
    container_name: dev.redisinsight
    image: redis/redisinsight:latest
    restart: always
    networks:
      - dev_backend_network
    ports:
      - "16081:5540"

  mongodb:
    container_name: dev.mongodb
    image: dev.mongodb:0.1
    build:
      context: ./mongodb
      args:
        - VERSION=6.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    expose:
      - 27017
    volumes:
      - ./mongodb/data:/data/db
    networks:
      - dev_backend_network
